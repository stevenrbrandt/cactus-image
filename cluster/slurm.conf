# Two-node test cluster. See cluster/README.md.
ClusterName=cactus
SlurmctldHost=node1

# Docker containers do not give SLURM a usable cgroup hierarchy, so track
# processes the old way and do not try to confine tasks. On a real machine
# these would be proctrack/cgroup and task/cgroup.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

SlurmUser=slurm
SlurmdUser=root
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
CredType=cred/munge

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU

# MpiDefault=none keeps `srun` from assuming a bootstrap method; the point of
# this cluster is to test each one explicitly with `srun --mpi=...`.
MpiDefault=none

# A node that fails and recovers should come back by itself rather than
# needing `scontrol update state=resume` after every experiment.
ReturnToService=2
# config_overrides: believe this file rather than what slurmd finds. The
# containers see all 80 host CPUs, and without this a node whose real
# hardware does not match the configured CPUs=8 is marked invalid and drained.
SlurmdParameters=config_overrides

NodeName=node[1-2] CPUs=8 RealMemory=4096 State=UNKNOWN
# OverSubscribe=YES because both "nodes" share one host: tests routinely want
# more ranks than the configured CPU count.
PartitionName=debug Nodes=ALL Default=YES MaxTime=INFINITE State=UP OverSubscribe=YES
