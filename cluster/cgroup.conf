# Slurm 24.11 autodetects cgroup/v2 and then tries to place slurmstepd in a
# systemd scope over dbus. A container has neither, and slurmd exits with
#   fatal: systemd scope for slurmstepd could not be set
# Disabling the cgroup plugin outright is consistent with the
# proctrack/linuxproc + task/none choices in slurm.conf: this cluster tests
# job launch and MPI bootstrap, not resource confinement.
CgroupPlugin=disabled
