# Cactus optionlist for this image's prebuilt ExternalLibraries, OpenMPI
# variant. See cactus-mpich.cfg for the MPICH counterpart -- pick whichever
# matches the PMI variant the target HPC site's Slurm exposes (OpenMPI here
# is built --with-pmix=external --with-slurm, so pair it with
# `srun --mpi=pmix`; see cactus-mpich.cfg's own header for the PMI-2 side).
# Use pmi-test-openmpi / pmi-test-mpich (also under /opt/cactus-deps) to
# check which one actually works on a given site before committing to it.
#
# This points Cactus's ExternalLibraries `detect.sh`/`configure.sh` scripts
# at dependencies already built into the image (see Dockerfile), so a
# `sim build` / `gmake <config>-config options=cactus-openmpi.cfg ...` run
# at singularity-build time does NOT re-download or rebuild any of them --
# it only configures, compiles, and links Cactus itself, against the
# hardware the singularity build actually runs on.
#
# Scope: everything the official einsteintoolkit.th (ET_2026_05) manifest's
# ExternalLibraries enable, except:
#   - NSIMD: deliberately left unset below. NSIMD dispatches to specific
#     SIMD ISA extensions detected from the build host's CPU -- baking it
#     into this Docker image would hard-code whatever CPU `docker build`
#     happened to run on, not the actual HPC node. Leave NSIMD_DIR unset (or
#     explicitly `= BUILD`) so Cactus builds it fresh at singularity-build
#     time, against the real target hardware. Do not set NSIMD_DIR here.
#   - LORENE, SGRID: large, special-purpose initial-data codes with their
#     own non-CMake build systems -- out of scope for this general-purpose
#     image. Add them by hand (LORENE_DIR / SGRID_DIR) if a specific build
#     needs them.
#
# All *_DIR / *_INC_DIRS / *_LIB_DIRS / *_LIBS below are set explicitly
# rather than left for each thorn's own auto-detection, on purpose: Debian
# manages multiple parallel MPI/HDF5 installs (openmpi vs mpich) through
# `update-alternatives`, whose generic names (`mpicc`, `mpirun`, `hdf5.pc`,
# ...) can silently point at a different implementation than the one these
# libraries were actually built against if alternatives are ever
# reconfigured. Pinning explicit, implementation-specific paths here makes
# this optionlist correct regardless of that state (see cactus-build-ref.md
# §14's Intel-MPI row for the same reasoning applied to a different site).

# ---------------------------------------------------------------------------
# Compilers
# ---------------------------------------------------------------------------
CC  = gcc
CXX = g++
F90 = gfortran
F77 = gfortran
LD  = g++

# AMReX 25.11 (see Dockerfile) only requires C++17, matching ADIOS2 and
# openPMD-api and SimFactory's own reference optionlist (mdb/optionlists/
# generic.cfg in the simfactory2 repo). Deliberately not opting into a
# newer standard than the toolchain actually needs -- C23/gnu23 already
# broke one old thorn earlier (see ac_cv_prog_cc_c23 below); no reason to
# invite the C++ equivalent in some other old thorn for no benefit.
CXXFLAGS = -O2 -g -std=c++17
CFLAGS   = -O2 -g
# gfortran >=10 defaults argument-mismatch / BOZ-literal checks to hard
# errors, which breaks a lot of Cactus's legacy F77-style Fortran. Required
# on this image's gcc 14 toolchain.
#
# -ffixed-line-length-none: several thorns (e.g. Exact) have fixed-form
# .F/.F77 source where a single logical line -- often a long CCTK_Equals
# string-comparison chain -- gets wrapped across a continuation line past
# column 72. gfortran's default fixed-form mode enforces the classic
# 72-column statement field, silently misparsing/truncating anything past
# it (a wrapped `then` disappearing -> "Missing THEN in ELSE IF statement";
# a wrapped identifier truncated mid-name -> "Symbol 'cctk_lbnd_ubnd' ...
# has no IMPLICIT type; did you mean 'cctk_lbnd'?"). Confirmed by
# reproducing both errors from the real generated source with this flag
# absent, and clean with it present.
#
# -fcray-pointer: several thorns (e.g. Exact/tmunu.F90) bridge a C pointer
# from CCTK_VarDataPtrI into Fortran via `pointer (cptr, fptr)` -- gfortran's
# non-standard Cray-pointer extension, which is refused outright without
# this flag ("Cray pointer declaration ... requires '-fcray-pointer' flag"),
# and then cascades into "Symbol 'ptxx' has no IMPLICIT type" everywhere the
# now-undeclared pointer variable is used. Confirmed the same way as above.
# Both flags match SimFactory's own reference optionlist (mdb/optionlists/
# generic.cfg in the simfactory2 repo), which pairs them for exactly this.
F90FLAGS = -O2 -g -fallow-argument-mismatch -fallow-invalid-boz -ffixed-line-length-none -fcray-pointer
F77FLAGS = -O2 -g -fallow-argument-mismatch -fallow-invalid-boz -ffixed-line-length-none -fcray-pointer

# Also from that reference optionlist:
# -rdynamic: exports symbols to the dynamic symbol table (backtraces /
# runtime symbol lookups some thorns and libraries rely on).
LDFLAGS = -rdynamic
# gfortran: LD is g++, not gfortran, so nothing puts libgfortran on the
# link line -- but Cactus links Fortran thorns into the same executable.
# Without it the link dies on "undefined reference to symbol
# '_gfortran_string_scan@@GFORTRAN_8' ... libgfortran.so.5: DSO missing
# from command line" (seen from EHFinder on the CUDA image, same cause
# here). cactus-build-ref.md §14's libgfortran row. No LIBDIRS needed:
# -lgfortran resolves via gcc's own private dir, which g++ searches.
LIBS = gfortran
# Without this, the PTHREADS ExternalLibraries thorn doesn't know pthreads
# is already part of glibc and will try to download and build its own.
PTHREADS_DIR = NO_BUILD

# Cactus's `lib/make/configure` is autoconf-generated, and autoconf's
# AC_PROG_CC unconditionally probes for the newest C standard the compiler
# accepts and appends it directly to $CC -- regardless of any -std= already
# in CFLAGS/CC, and regardless of what the compiler's own *default* standard
# is (gcc 14's default is C17, but it also accepts -std=gnu23 when asked,
# so autoconf picks that). C23 makes `bool` a real keyword, which breaks
# old C thorns that do `typedef int bool;` (e.g. Numerical/AEILocalInterp)
# with "two or more data types in declaration specifiers".
#
# `setup_configuration.pl` loads every `KEY = value` line in this file
# straight into the environment `lib/make/configure` runs in (see
# ParseOptionsFile), so pre-seeding autoconf's own cache variable here
# short-circuits that probe instead of fighting it via compiler flags:
ac_cv_prog_cc_c23 = no

# `lib/make/configure` has a block ("if test -z "$LD"; then LD="$CXX"; ...")
# that copies every CXX_*_FLAGS (including CXX_OPENMP_FLAGS) onto the
# matching LD_*_FLAGS, but ONLY when LD itself was left unset for it to
# default to $CXX. Because LD is set explicitly above, that inheritance is
# skipped entirely, so LD_OPENMP_FLAGS is never populated: every thorn
# compiles fine (each .o gets -fopenmp via CXX_OPENMP_FLAGS), but the final
# link doesn't pass -fopenmp to g++, so it never pulls in -lgomp -- "ld:
# undefined reference to `GOMP_parallel'/`omp_get_num_threads'/etc." across
# every OpenMP-using thorn simultaneously, only at the final link stage.
# SimFactory's own reference optionlist (generic.cfg) sets this explicitly
# too, for the same reason.
LD_OPENMP_FLAGS = -fopenmp

OPENMP = yes

DEBUG    = no
OPTIMISE = yes
PROFILE  = no

# ---------------------------------------------------------------------------
# MPI: OpenMPI explicitly. The source-built C++ stack below (AMReX/ADIOS2/
# openPMD-api) is linked against this same OpenMPI -- OpenMPI and MPICH are
# not ABI-compatible, so Cactus's own MPI thorn must resolve to whichever
# implementation those libraries were actually built against, or the final
# link/runtime breaks. Set manually rather than via the mpicc/mpicxx
# wrapper so this stays correct regardless of whatever
# `update-alternatives --config mpi` currently points at -- see
# cactus-build-ref.md §14.
# ---------------------------------------------------------------------------
MPI_DIR      = /opt/mpi/openmpi
# MPI_HOME is what CMake's FindMPI honors as a search hint. Cactus's
# optionlist parser (setup_configuration.pl's ParseOptionsFile) loads every
# KEY = value line straight into the environment the build runs in, so this
# reaches any ExternalLibrary built at singularity time via CMake --
# notably AMReX's bundled build.sh, which passes CMake no MPI hints of its
# own. Without it, FindMPI resolves /usr/bin/mpicc through
# update-alternatives and silently picks OpenMPI no matter which optionlist
# is in use. Verified: MPI_HOME=/opt/mpi/mpich -> libmpich.so,
# MPI_HOME=/opt/mpi/openmpi -> openmpi's libmpi.so.
MPI_HOME     = /opt/mpi/openmpi
MPI_INC_DIRS = /opt/mpi/openmpi/include /opt/mpi/openmpi/include/openmpi
MPI_LIB_DIRS = /opt/mpi/openmpi/lib
MPI_LIBS     = mpi

# ---------------------------------------------------------------------------
# Apt-provided ExternalLibraries (Debian trixie ships all of these; no
# reason to build from source). HDF5 is the one MPI-flavor-specific
# exception -- Debian ships separate openmpi/mpich builds of it.
# ---------------------------------------------------------------------------
HDF5_DIR            = /usr
HDF5_INC_DIRS       = /usr/include/hdf5/openmpi
HDF5_LIB_DIRS       = /usr/lib/x86_64-linux-gnu/hdf5/openmpi
HDF5_LIBS           = hdf5hl_fortran hdf5_fortran hdf5_hl hdf5
HDF5_ENABLE_FORTRAN = yes
HDF5_ENABLE_CXX     = no

ZLIB_DIR    = /usr
GSL_DIR     = /usr
FFTW3_DIR   = /usr
BOOST_DIR   = /usr
HWLOC_DIR   = /usr
LIBJPEG_DIR = /usr
OPENSSL_DIR = /usr
YAML_CPP_DIR = /usr
SILO_DIR     = /usr

# BLAS/LAPACK's own configure.sh searches a fixed list of directories
# (/usr/lib, /usr/lib64, ...) that does NOT include Debian's multiarch
# path -- point at it explicitly rather than relying on that search.
BLAS_DIR   = /usr/lib/x86_64-linux-gnu
LAPACK_DIR = /usr/lib/x86_64-linux-gnu

# ---------------------------------------------------------------------------
# Source-built ExternalLibraries (the CarpetX I/O/driver stack; built into
# the image by the Dockerfile, linked against OpenMPI -- see above)
# ---------------------------------------------------------------------------
AMREX_DIR = /opt/cactus-deps/amrex-openmpi

ADIOS2_DIR        = /opt/cactus-deps/adios2-openmpi
ADIOS2_INC_DIRS   = /opt/cactus-deps/adios2-openmpi/include
ADIOS2_LIB_DIRS   = /opt/cactus-deps/adios2-openmpi/lib
# Explicit, rather than left to detect.sh's own find_lib: ADIOS2 >=2.9
# renamed libadios2_cxx11 -> libadios2_cxx, which the ET_2026_05 thorn's
# detect.sh (written for the older name) doesn't know to look for.
ADIOS2_LIBS       = adios2_cxx_mpi adios2_c_mpi adios2_core_mpi adios2_cxx adios2_c adios2_core
ADIOS2_ENABLE_SST = no

OPENPMD_DIR = /opt/cactus-deps/openpmd-openmpi

# ---------------------------------------------------------------------------
# NSIMD -- intentionally omitted (see header comment). Leave unset so
# Cactus builds it at singularity-build time against the real target CPU:
#
# NSIMD_DIR = BUILD

# ---------------------------------------------------------------------------
# Not built into this image (see header comment) -- set by hand if needed:
#
# LORENE_DIR = ...
# SGRID_DIR  = ...
